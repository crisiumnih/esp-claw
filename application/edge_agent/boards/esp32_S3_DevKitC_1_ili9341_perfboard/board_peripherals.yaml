version: 1.0.0
# Peripherals Configuration
peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 41
        scl: 42

  - name: i2s_audio_out
    type: i2s
    role: master
    format: pdm-out
    config:
      sample_rate_hz: 16000
      clk_src: I2S_CLK_SRC_DEFAULT
      mclk_multiple: 256
      up_sample_fp: 960
      up_sample_fs: 441
      bclk_div: 8
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_MONO
      slot_mask: I2S_PDM_SLOT_LEFT
      data_fmt: "I2S_PDM_DATA_FMT_PCM"
      sd_prescale: 0
      sd_scale: I2S_PDM_SIG_SCALING_MUL_4
      hp_scale: I2S_PDM_SIG_SCALING_MUL_4
      lp_scale: I2S_PDM_SIG_SCALING_MUL_4
      sinc_scale: I2S_PDM_SIG_SCALING_MUL_4
      line_mode: I2S_PDM_TX_ONE_LINE_CODEC
      hp_en: false
      hp_cut_off_freq_hz: 35.5
      sd_dither: 0
      sd_dither2: 1
      pins:
        dout: 40
      invert_flags:
        clk_inv: false

  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI3_HOST
        data0_io_num: 11
        sclk_io_num: 12
        max_transfer_sz: 4800
