# Keep this config portable across machines.
# For a custom install location, prefer CLI/env overrides per host, e.g.:
#   ESP_PATH=/opt/espressif eim install --config eim_config.toml
# or:
#   eim install --config eim_config.toml -p /opt/espressif
target = ["all"]
idf_versions = ["v5.5.4"]
tools_json_file = "tools/tools.json"
config_file_save_path = "eim_config.toml"
non_interactive = true
wizard_all_questions = false
mirror = "https://dl.espressif.com/github_assets"
idf_mirror = "https://github.com"
pypi_mirror = "https://pypi.org/simple"
recurse_submodules = true
install_all_prerequisites = true
skip_prerequisites_check = false
cleanup = false
python_env_folder_name = "python"
python_version_override = "python313"
create_bat_activation_script = false

[idf_features_per_version]
"v5.5.4" = ["core"]

[idf_tools_per_version]
"v5.5.4" = ["xtensa-esp-elf-gdb", "riscv32-esp-elf-gdb", "xtensa-esp-elf", "esp-clang", "esp-clang-libs", "riscv32-esp-elf", "esp32ulp-elf", "cmake", "openocd-esp32", "ninja", "esp-rom-elfs"]
